# Public APIs and publisher-provided RSS only. Each source fails independently.
sources:
  - name: simon_willison
    type: rss
    url: https://simonwillison.net/atom/everything/
    reliability: 0.6
    source_tier: S
    evidence_role: personal_author_account
    limit: 20
  - name: armin_ronacher
    type: rss
    url: https://lucumr.pocoo.org/feed.atom
    reliability: 0.6
    source_tier: S
    evidence_role: personal_author_account
    limit: 10
  - name: ethan_mollick
    type: rss
    url: https://www.oneusefulthing.org/feed
    reliability: 0.6
    source_tier: S
    evidence_role: personal_author_account
    limit: 10
  - name: human_story_search
    type: hn_story_search
    enabled: true
    reliability: 0.55
    limit: 80
    hits_per_query: 5
    max_age_days: 7
    comment_stories: 20
    comments_per_story: 6
    replies_per_comment: 1
    # Public search index for discovery; original text/comments via official Firebase API.
    query_config: story_mining.yaml
  - name: reddit_experiences
    type: restricted_adapter
    reason: No authorized API configured; add public experience URLs and necessary excerpts through Manual Inbox.
  - name: creator_communities
    type: restricted_adapter
    reason: Login-gated communities are not collected; use Manual Inbox with supplied evidence.
  - {name: hacker_news, type: hacker_news, enabled: true, limit: 60, reliability: 0.65}
  - name: github_search
    type: github_search
    enabled: true
    limit: 30
    reliability: 0.75
    query: 'topic:artificial-intelligence stars:>20'
  - name: github_releases
    type: github_releases
    enabled: true
    limit: 3
    reliability: 0.85
    repositories: [huggingface/transformers, ollama/ollama, langchain-ai/langchain]
  - {name: openai_blog, type: rss, url: 'https://openai.com/news/rss.xml', reliability: 0.9}
  - {name: deepmind_blog, type: rss, url: 'https://deepmind.google/blog/rss.xml', reliability: 0.9}
  - {name: google_ai_blog, type: rss, url: 'https://blog.google/technology/ai/rss/', reliability: 0.9}
  - {name: microsoft_ai_blog, type: rss, url: 'https://blogs.microsoft.com/feed/', reliability: 0.9}
  - {name: meta_ai_blog, type: restricted_adapter, reason: 'Publisher RSS returned 404; use manual URLs until a stable official feed/API is verified.'}
  - {name: nvidia_blog, type: rss, url: 'https://blogs.nvidia.com/feed/', reliability: 0.9}
  - {name: huggingface_blog, type: rss, url: 'https://huggingface.co/blog/feed.xml', reliability: 0.85}
  - {name: techcrunch, type: rss, url: 'https://techcrunch.com/feed/', reliability: 0.7}
  - {name: ars_technica, type: rss, url: 'https://feeds.arstechnica.com/arstechnica/index', reliability: 0.75}
  - name: anthropic_blog
    type: restricted_adapter
    enabled: true
    reason: No configured stable publisher RSS/API; use manual URLs until one is verified.
  - name: telegram
    type: telegram_bot
    enabled: true
    token_env: TELEGRAM_BOT_TOKEN
    # Add public channel usernames where YOUR dedicated bot is an authorized member.
    channels: []
    max_batches: 5
    reliability: 0.45

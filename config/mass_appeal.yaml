rubrics:
  recognizable_entity: 中国普通用户对人物、公司、产品的认知；知名但只有琐碎动作不能满分
  immediate_understandability: 不懂程序、API、开发工具的读者能否在三秒理解事件和意义
  personal_stakes: 已有事实触及钱、工作、时间、关系、隐私、机会或生活，不计虚构未来后果
  emotional_charge: 事实自身引发惊讶、恐惧、愤怒、羡慕、希望、好奇或争议，不编造情绪
  china_information_gap: 有国内传播检索证据才判断信息差；未知最多得此维度的35%，海外不等于国内没人看
  visual_headline_power: 真实可支持一句话标题、强封面或前后对比；夸大危害和结果不得加分
negative_training_example:
  title: 他的网站变慢了，来的却未必是读者
  user_quote: 一点都不吸引人。
  decision: DISLIKE
  lesson: 陌生开发者的小网站流量故事，即使 who/action/result 完整，也不能绕过绝对大众吸引力闸门
feedback_reasons:
  too_niche: 小圈子话题，普通用户入口弱
  weak_mass_appeal: 大众吸引力不足
  weak_social_heat: 没有足够真实传播热度
  weak_recognizable_entity: 人物或产品认知度弱
  low_stop_scroll: 不足以让读者停下来
  programmer_bias: 程序员兴趣替代了大众兴趣
  best_of_bad_batch: 从一批弱题中选第一而绕过绝对门槛
levels:
  recognizable_entity:
  - 陌生个人或产品，中国普通用户没有认知入口
  - 极小圈层有认知，事情本身也小
  - 技术或专业圈有认知，普通用户需要解释
  - 中国科技兴趣用户广泛认识的人物、公司或产品，且这次动作有意义
  - 大众家喻户晓的实体且发生实质性变化，名字与事件共同构成强认知入口
  immediate_understandability:
  - 必须理解API、模型架构或开发基础才能理解
  - 需要多段技术解释才能看出意义
  - 看过一段背景能明白，有概念门槛
  - 一个普通中文句子能说清楚事件和意义，不需要技术背景
  - 三秒看到具体生活场景或反差就能理解，例如聊天服务可能关停、机器人投中、手机防诈骗
  personal_stakes:
  - 与普通用户的钱、工作、关系、隐私、时间或生活没有明确联系
  - 只有泛泛未来影响或公司内部技术指标
  - 一类明确人群有真实利益关系，影响范围有限
  - 很多普通人遇到的工作、费用、关系或隐私问题有具体入口
  - 大范围直接重大利益或风险已经有真实事实支持，不能靠假想后果
  emotional_charge:
  - 无情绪，仅常规参数公告
  - 只有专业圈兴趣或轻微新鲜感
  - 有明确好奇、期待或争议，但反差一般
  - 普通人能感受到强惊讶、担忧、希望、关系张力或反转，事实支持
  - 极强真实反差和人性冲击，无夸大、造假或情绪煽动
  china_information_gap:
  - 国内已经广泛刷屏，或内容无法与中国用户建立关系
  - 中国传播范围未知，没有检索证据；最多35%的维度信用
  - 有部分国内检索证据，能说明某些信息未被充分讲清
  - 系统检索显示相关细节在国内覆盖较少，且中国用户明显关心
  - 有充分国内传播对照证据，信息差大且直接相关
  visual_headline_power:
  - 很难形成具体一句话入口，只有术语或参数
  - 标题需要过度概括或虚构反差才吸引人
  - 能形成清楚标题但画面感、冲突或收藏点一般
  - 事实天然支持一个强中文标题、视觉动作或前后对比
  - 标题与可核验的强视觉、巨大反差或立即可用收益共同让人停下，不能夸张
  human_trigger:
  - 没有利益、身份、恐惧、反转、新奇、实用、公平或关系张力
  - 小圈层动机，真实但普通人难代入
  - 一种清楚的人性触发，范围或强度中等
  - 强利益、身份、情绪或反差，一般读者能投射自己；不要求第一人称
  - 多种强人性触发与事实结合，直接触及大众生活或非常强的真实惊讶
  viral_potential:
  - 大众基本不会点击、收藏、评论或分享
  - 只有专业圈小众阅读动机，没有大众入口
  - 有理解和点击入口，但传播动力一般或事实尚弱
  - 具体大众兴趣加真实强反差、实用价值或热度，具有传播动力
  - 极强大众入口且有足够事实与真实传播或收藏价值支持，不能只看名气或结构完整

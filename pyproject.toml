[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xiaohongshu-content-engine"
version = "0.1.0"
description = "Overseas content discovery with internal provenance and human editorial review"
requires-python = ">=3.12"
dependencies = ["httpx[socks]>=0.27,<1", "pydantic>=2.9,<3", "feedparser>=6,<7", "PyYAML>=6,<7", "typer>=0.12,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/xhs_content_engine"]

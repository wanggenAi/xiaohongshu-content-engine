name: Content Engine
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'

permissions:
  contents: read

concurrency:
  group: content-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv sync --frozen --python 3.12 --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  collect:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - uses: actions/cache/restore@v4
        with:
          path: data/content.sqlite3
          key: content-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: content-state-v1-
      - name: Discover and package candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: uv run python -m xhs_content_engine run
      - name: Validate artifact counts and public wording
        run: uv run python -m xhs_content_engine verify-outputs
      - name: Job summary
        run: cat outputs/top_candidates.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        with:
          path: data/content.sqlite3
          key: content-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        with:
          name: content-candidates-${{ github.run_id }}
          path: outputs/
          retention-days: 14
